      STORY: identify the comparison, read indexed files, annotate exact lines, preview or return feedback, then refresh, resolve, and approve.
      FIRST VIEWPORT: a compact brand/context header frames a persistent file index and an expansive diff proof with inline notes; feedback actions stay obvious without crowding the code.
