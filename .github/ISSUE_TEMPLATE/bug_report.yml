name: Bug report
description: Report behavior you can reproduce
labels: [bug, needs-triage]
body:
  - type: input
    id: version
    attributes: {label: diffle version, description: Run diffle --version}
    validations: {required: true}
  - type: input
    id: environment
    attributes: {label: OS and architecture, placeholder: Windows 11 x64}
    validations: {required: true}
  - type: dropdown
    id: install
    attributes: {label: Installation method, options: [Installer, GitHub Release, Source checkout, Other]}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Relevant logs, description: Remove tokens and private data before posting., render: text}
