name: Feature request
description: Suggest a change to the review workflow
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What review task is difficult today?
      description: Describe the task and what happens now.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
