name: dist-dry-run

# proves the npm / homebrew / scoop distribution without publishing anything: builds real release
# binaries for three targets, stages the npm packages from them, dry-runs npm pack + publish, installs
# the packed tarballs globally on all three OSes, and style/audits the rendered formula and manifest.

on:
  pull_request:
    paths:
      - ".github/workflows/dist-dry-run.yml"
      - ".github/workflows/release.yml"
      - "npm/**"
      - "scripts/distribution/**"
      - "scripts/stage-npm.ts"
      - "scripts/render-formula.ts"
      - "scripts/render-scoop.ts"
      - "scripts/build-release.ts"
      - "src/core/npmPackage.ts"
      - "src/core/updateTarget.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      # the targets built here; the smoke matrix below installs one per OS
      TARGETS: linux-x64,darwin-arm64,windows-x64
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Build release binaries for three targets
        run: bun scripts/build-release.ts linux-x64 darwin-arm64 windows-x64
      - name: Stage the npm packages
        run: |
          version=$(node -p "require('./package.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bun scripts/stage-npm.ts --version "$version" --assets dist/release --out dist/npm --targets "$TARGETS"
      - name: npm pack --dry-run every staged package
        run: |
          for dir in dist/npm/*/; do
            echo "::group::$dir"
            npm pack --dry-run "$dir"
            echo "::endgroup::"
          done
      - name: npm publish --dry-run the main package
        run: npm publish --dry-run ./dist/npm/nittle
      - name: Pack tarballs for the install smoke
        run: |
          mkdir -p dist/tgz
          for dir in dist/npm/*/; do npm pack "$dir" --pack-destination dist/tgz; done
          ls -l dist/tgz
      - name: Render the formula and the scoop manifest
        run: |
          mkdir -p dist/pkg
          bun scripts/render-formula.ts "$VERSION" tests/fixtures/distribution/checksums.txt dist/pkg/nittle.rb
          bun scripts/render-scoop.ts "$VERSION" tests/fixtures/distribution/checksums.txt dist/pkg/nittle.json
          cat dist/pkg/nittle.rb
      - name: Validate the scoop manifest
        run: |
          jq -e '.version and .architecture["64bit"].url and .architecture.arm64.url and .checkver and .autoupdate.architecture["64bit"].hash.regex and .bin' dist/pkg/nittle.json
          # the autoupdate hash regex must match a checksums.txt line for each architecture
          node -e '
            const m = JSON.parse(require("fs").readFileSync("dist/pkg/nittle.json", "utf8"));
            const sums = require("fs").readFileSync("tests/fixtures/distribution/checksums.txt", "utf8");
            for (const [arch, a] of Object.entries(m.autoupdate.architecture)) {
              const re = new RegExp(a.hash.regex.replace("$sha256", "([a-fA-F0-9]{64})"));
              if (!re.test(sums)) throw new Error("autoupdate regex does not match checksums.txt for " + arch);
            }
            console.log("scoop manifest ok");'
      - uses: actions/upload-artifact@v7
        with:
          name: dist-dry-run
          path: |
            dist/tgz
            dist/pkg
          if-no-files-found: error

  npm-smoke:
    name: npm install smoke (${{ matrix.os }})
    needs: stage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: dist-dry-run
          path: artifact
      - name: Install the local tarballs globally and run the binary
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          home="$RUNNER_TEMP/home"; prefix="$RUNNER_TEMP/prefix"; mkdir -p "$home"
          export HOME="$home" XDG_CONFIG_HOME="$home/.config" CLAUDE_CONFIG_DIR="$home/.claude" CODEX_HOME="$home/.codex" NITTLE_NO_UPDATE_CHECK=1
          npm i -g --prefix "$prefix" "./artifact/tgz/nittle-$version.tgz" "./artifact/tgz/nittle-${{ matrix.platform }}-$version.tgz"
          export PATH="$prefix/bin:$PATH"
          out=$(nittle --version)
          echo "$out"
          echo "$out" | head -n1 | grep -Fx "nittle v$version"
      # windows uses the npm .cmd shim from pwsh, the way a user would; git bash cannot run it with a mixed-style path
      - name: Install the local tarballs globally and run the binary (windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $home_dir = Join-Path $env:RUNNER_TEMP 'home'; $prefix = Join-Path $env:RUNNER_TEMP 'prefix'
          New-Item -ItemType Directory $home_dir | Out-Null
          $env:HOME = $home_dir; $env:XDG_CONFIG_HOME = "$home_dir\.config"; $env:CLAUDE_CONFIG_DIR = "$home_dir\.claude"; $env:CODEX_HOME = "$home_dir\.codex"; $env:NITTLE_NO_UPDATE_CHECK = '1'
          npm i -g --prefix $prefix "./artifact/tgz/nittle-$version.tgz" "./artifact/tgz/nittle-${{ matrix.platform }}-$version.tgz"
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          $env:PATH = "$prefix;$env:PATH"
          $first = (nittle --version | Select-Object -First 1)
          Write-Host $first
          if ($first -ne "nittle v$version") { throw "unexpected version output: $first" }

  brew-audit:
    runs-on: macos-latest
    timeout-minutes: 15
    needs: stage
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-dry-run
          path: artifact
      - name: style and audit the formula from a throwaway local tap
        run: |
          brew tap-new --no-git local/dist
          tap_dir="$(brew --repository local/dist)"
          mkdir -p "$tap_dir/Formula"
          cp artifact/pkg/nittle.rb "$tap_dir/Formula/nittle.rb"
          brew style local/dist/nittle
          brew audit --formula local/dist/nittle
