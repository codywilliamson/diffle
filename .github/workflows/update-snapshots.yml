name: update-snapshots

# regenerates the visual baselines on linux (never on a dev machine) and commits them to a branch.
# the branch's own scripts run during the render, so that step has no write credentials: the
# checkout drops them, and only the final push step gets a token.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch of this repo to update snapshots on (not main)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-snapshots-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: update snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ inputs.ref }}
    steps:
      - name: validate branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! [[ "$TARGET_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$TARGET_BRANCH" == *..* ]]; then
            echo "invalid branch name" >&2; exit 1
          fi
          case "$TARGET_BRANCH" in
            main|master|refs/*|origin/*) echo "refusing to update $TARGET_BRANCH" >&2; exit 1 ;;
          esac
          if ! git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/heads/${TARGET_BRANCH}" >/dev/null; then
            echo "branch $TARGET_BRANCH does not exist in $REPO" >&2; exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # same script and image as CI and `bun run test:e2e:docker:update`; no credentials here
      - run: bun scripts/e2e-docker.ts --update
      - name: commit and push snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all e2e/__snapshots__
          if git diff --cached --quiet; then
            echo "no snapshot changes"
            exit 0
          fi
          git commit -m "test: update visual snapshots"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin "HEAD:refs/heads/${TARGET_BRANCH}"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: update-snapshots-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
