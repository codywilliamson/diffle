name: update-snapshots

# regenerates the visual baselines on linux (never on a dev machine) and commits them to a branch.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch to update snapshots on
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-snapshots-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: update snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # same script and image as CI and `bun run test:e2e:docker:update`
      - run: bun scripts/e2e-docker.ts --update
      - name: commit changed snapshots
        env:
          TARGET_BRANCH: ${{ inputs.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all e2e/__snapshots__
          if git diff --cached --quiet; then
            echo "no snapshot changes"
            exit 0
          fi
          git commit -m "test: update visual snapshots"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: update-snapshots-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
