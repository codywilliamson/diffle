name: release

# Release Please owns version analysis, the release PR, CHANGELOG, the vX.Y.Z tag, and a DRAFT
# GitHub Release. Merging its release PR is the release action. Downstream jobs build every
# target's binary + MCPB, upload them into that draft, and publish it — all in one workflow so we
# never depend on a release-triggered event that the built-in GITHUB_TOKEN suppresses.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release-please:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      transition: ${{ steps.build.outputs.transition }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # cross-compiles all six targets to dist/release/* and writes checksums.txt. the first
      # TRANSITION_ASSET_RELEASES releases after 0.28.1 (src/core/transitionAssets.ts) also get
      # byte-identical diffle-<os>-<arch>[.exe] copies so 0.28.x `diffle update` finds an asset;
      # the 4th release after 0.28.1 is the first without them. the window counts published
      # releases (read-only GitHub API call with GH_TOKEN), never tags, so a failed or draft
      # release can't use it up; if the API is unreadable the copies are published. the step
      # reports `transition=true|false` for the jobs that depend on the diffle assets.
      - name: Build target binaries + checksum manifest
        id: build
        run: bun scripts/build-release.ts
      # one self-contained MCPB per target (the binary already embeds the client)
      - name: Pack per-target MCPBs
        run: |
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            bun scripts/stage-mcpb.ts "$t"
            bun x mcpb validate mcpb/manifest.json
            bun x mcpb pack mcpb "dist/release/nittle-$t.mcpb"
          done
      - name: Smoke compiled Linux binary
        run: bun scripts/smoke-binary.ts dist/release/nittle-linux-x64
      # the transition copy (when this release has one) must run as itself under its old name
      - name: Smoke the diffle-named transition asset
        run: |
          if [ -f dist/release/diffle-linux-x64 ]; then
            bun scripts/smoke-binary.ts dist/release/diffle-linux-x64
            cmp dist/release/nittle-linux-x64 dist/release/diffle-linux-x64
          fi
      - name: Upload assets into the draft release
        run: gh release upload "$TAG" dist/release/* --clobber
      # publish only after every asset uploaded successfully
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false

  installers:
    name: installers (post-publish) (${{ matrix.os }})
    needs: [release-please, assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
      issues: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Smoke install and uninstall
        id: smoke
        # authenticates the installers' release lookup; shared macos runner ips hit the anonymous limit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/smoke-installer.ts
      - name: Report installer failure
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/report-installer-failure.ts

  # a real `diffle update` from 0.28.1 against the release that was just published. passes only while
  # the release still carries the diffle-named transition assets (src/core/transitionAssets.ts)
  upgrade-smoke:
    needs: [release-please, assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.assets.outputs.transition == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/upgrade-smoke.yml
    with:
      mode: live

  # npm publish (#195). off until the repo variable NPM_PUBLISH is 'true'. uses npm trusted publishing
  # (OIDC): no token anywhere. the package names must be reserved and the trusted publisher configured
  # on npmjs.com first. platform packages go first so the main package never points at a missing
  # optional dependency.
  npm-publish:
    needs: [release-please, assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' && vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Download the release binaries
        run: gh release download "$TAG" --dir dist/release --pattern 'nittle-*' --pattern checksums.txt
      - name: Stage the npm packages
        run: bun scripts/stage-npm.ts --version "${TAG#v}" --assets dist/release --out dist/npm
      - name: Publish platform packages, then the main package
        id: publish
        run: |
          version="${TAG#v}"
          for dir in dist/npm/nittle-*/ dist/npm/nittle/; do
            name=$(node -p "require('./${dir}package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi
            npm publish "./$dir" --provenance --access public
          done
          echo "published=true" >> "$GITHUB_OUTPUT"

  # post-publish: the registry can lag a few seconds behind the publish
  npm-smoke:
    name: npm smoke (post-publish) (${{ matrix.os }})
    needs: [release-please, npm-publish]
    if: ${{ needs.npm-publish.result == 'success' && needs.npm-publish.outputs.published == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      NITTLE_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: npx nittle --version
        shell: bash
        run: |
          version="${TAG#v}"
          for attempt in 1 2 3 4 5 6; do
            if out=$(npx --yes "nittle@$version" --version) && echo "$out" | head -n1 | grep -Fx "nittle v$version"; then exit 0; fi
            sleep 20
          done
          echo "npx nittle@$version never printed the expected version"; exit 1

  # homebrew tap + scoop bucket (#196). off until the repo variable TAP_PUBLISH is 'true' and the
  # DIST_REPO_TOKEN secret (fine-grained, contents:write on the tap and bucket repos only) exists.
  # secrets cannot gate a job `if`, so a missing token makes the push steps skip, not fail.
  tap-publish:
    needs: [release-please, assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' && vars.TAP_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    # true only when both repos were pushed (or already current); a missing token leaves it empty
    outputs:
      published: ${{ steps.push.outputs.published }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      DIST_REPO_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
      TAP_REPO: ${{ vars.TAP_REPO || 'codywilliamson/homebrew-tap' }}
      BUCKET_REPO: ${{ vars.BUCKET_REPO || 'codywilliamson/scoop-bucket' }}
    steps:
      - name: Check the token is configured
        id: token
        run: |
          if [ -n "$DIST_REPO_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::warning::DIST_REPO_TOKEN is not set; skipping the tap and bucket push"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.token.outputs.present == 'true' }}
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ steps.token.outputs.present == 'true' }}
        with:
          bun-version: 1.3.14
      - if: ${{ steps.token.outputs.present == 'true' }}
        run: bun install --frozen-lockfile
      - name: Render the formula and the manifest from the published checksums
        if: ${{ steps.token.outputs.present == 'true' }}
        run: |
          gh release download "$TAG" --dir dist/release --pattern checksums.txt
          mkdir -p dist/pkg
          bun scripts/render-formula.ts "${TAG#v}" dist/release/checksums.txt dist/pkg/nittle.rb
          bun scripts/render-scoop.ts "${TAG#v}" dist/release/checksums.txt dist/pkg/nittle.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.token.outputs.present == 'true' }}
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.DIST_REPO_TOKEN }}
          path: tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.token.outputs.present == 'true' }}
        with:
          repository: ${{ env.BUCKET_REPO }}
          token: ${{ secrets.DIST_REPO_TOKEN }}
          path: bucket
      - name: Commit and push both (plain pushes, never forced)
        id: push
        if:${{ steps.token.outputs.present == 'true' }}
        run: |
          version="${TAG#v}"
          mkdir -p tap/Formula bucket/bucket
          cp dist/pkg/nittle.rb tap/Formula/nittle.rb
          cp dist/pkg/nittle.json bucket/bucket/nittle.json
          for repo in tap bucket; do
            git -C "$repo" config user.name "github-actions[bot]"
            git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$repo" add -A
            if git -C "$repo" diff --cached --quiet; then echo "$repo already up to date"; continue; fi
            git -C "$repo" commit -m "chore: nittle $version"
            git -C "$repo" pull --rebase
            git -C "$repo" push
          done
          echo "published=true" >> "$GITHUB_OUTPUT"

  # post-publish: install through the real managers and assert the version
  brew-scoop-smoke:
    name: ${{ matrix.manager }} smoke (post-publish)
    needs: [release-please, tap-publish]
    if: ${{ needs.tap-publish.result == 'success' && needs.tap-publish.outputs.published == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            manager: brew
          - os: windows-latest
            manager: scoop
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      TAP_REPO: ${{ vars.TAP_REPO || 'codywilliamson/homebrew-tap' }}
      BUCKET_REPO: ${{ vars.BUCKET_REPO || 'codywilliamson/scoop-bucket' }}
      NITTLE_NO_UPDATE_CHECK: "1"
    steps:
      - name: brew install
        if: ${{ matrix.manager == 'brew' }}
        run: |
          version="${TAG#v}"
          tap_name="${TAP_REPO/homebrew-/}"
          brew install "$tap_name/nittle"
          nittle --version | head -n1 | grep -Fx "nittle v$version"
      - name: scoop install
        if: ${{ matrix.manager == 'scoop' }}
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Invoke-Expression "& {$(Invoke-RestMethod get.scoop.sh)} -RunAsAdmin"
            $env:PATH = "$HOME\scoop\shims;$env:PATH"
          }
          scoop bucket add nittle "https://github.com/$env:BUCKET_REPO"
          scoop install nittle/nittle
          $first = (nittle --version | Select-Object -First 1)
          if ($first -ne "nittle v$version") { throw "unexpected version output: $first" }

  release-pr:
    needs: [release-please, assets]
    # Wait for a draft release to publish; still run when no release means assets was skipped.
    if: ${{ always() && needs.release-please.result == 'success' && (needs.assets.result == 'success' || needs.assets.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
