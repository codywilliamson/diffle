name: release

# Release Please owns version analysis, the release PR, CHANGELOG, the vX.Y.Z tag, and a DRAFT
# GitHub Release. Merging its release PR is the release action. Downstream jobs build every
# target's binary + MCPB, upload them into that draft, and publish it — all in one workflow so we
# never depend on a release-triggered event that the built-in GITHUB_TOKEN suppresses.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release-please:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      transition: ${{ steps.build.outputs.transition }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # cross-compiles all six targets to dist/release/* and writes checksums.txt. the first
      # TRANSITION_ASSET_RELEASES releases after 0.28.1 (src/core/transitionAssets.ts) also get
      # byte-identical diffle-<os>-<arch>[.exe] copies so 0.28.x `diffle update` finds an asset;
      # the 4th release after 0.28.1 is the first without them. the window counts published
      # releases (read-only GitHub API call with GH_TOKEN), never tags, so a failed or draft
      # release can't use it up; if the API is unreadable the copies are published. the step
      # reports `transition=true|false` for the jobs that depend on the diffle assets.
      - name: Build target binaries + checksum manifest
        id: build
        run: bun scripts/build-release.ts
      # one self-contained MCPB per target (the binary already embeds the client)
      - name: Pack per-target MCPBs
        run: |
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            bun scripts/stage-mcpb.ts "$t"
            bun x mcpb validate mcpb/manifest.json
            bun x mcpb pack mcpb "dist/release/nittle-$t.mcpb"
          done
      - name: Smoke compiled Linux binary
        run: bun scripts/smoke-binary.ts dist/release/nittle-linux-x64
      # the transition copy (when this release has one) must run as itself under its old name
      - name: Smoke the diffle-named transition asset
        run: |
          if [ -f dist/release/diffle-linux-x64 ]; then
            bun scripts/smoke-binary.ts dist/release/diffle-linux-x64
            cmp dist/release/nittle-linux-x64 dist/release/diffle-linux-x64
          fi
      - name: Upload assets into the draft release
        run: gh release upload "$TAG" dist/release/* --clobber
      # publish only after every asset uploaded successfully
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false

  installers:
    name: installers (post-publish) (${{ matrix.os }})
    needs: [release-please, assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
      issues: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Smoke install and uninstall
        id: smoke
        # authenticates the installers' release lookup; shared macos runner ips hit the anonymous limit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/smoke-installer.ts
      - name: Report installer failure
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/report-installer-failure.ts

  # a real `diffle update` from 0.28.1 against the release that was just published. passes only while
  # the release still carries the diffle-named transition assets (src/core/transitionAssets.ts)
  upgrade-smoke:
    needs: [release-please, assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.assets.outputs.transition == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/upgrade-smoke.yml
    with:
      mode: live

  release-pr:
    needs: [release-please, assets]
    # Wait for a draft release to publish; still run when no release means assets was skipped.
    if: ${{ always() && needs.release-please.result == 'success' && (needs.assets.result == 'success' || needs.assets.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
