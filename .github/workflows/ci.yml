name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-root-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit -p .
      # the completion tests run zsh and fish for real when they are installed
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fish
      # process-table and stdio tests take ~4s on windows runners, close to bun's 5s default.
      - run: bun test --timeout 10000
      - run: bun run test:agent-loop

  # real language server: endpoint integration tests plus the latency bench (cold < 3000 ms, warm p95 < 300 ms).
  # typescript 5.x on purpose: typescript 7 has no tsserver.js, which typescript-language-server needs.
  lsp:
    name: lsp (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_REAL_LSP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-root-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: install the language server
        run: |
          npm install --prefix "$RUNNER_TEMP/lsp-server" --no-audit --no-fund --save-exact typescript-language-server@5.3.0 typescript@5.9.3
          echo "$RUNNER_TEMP/lsp-server/node_modules/.bin" >> "$GITHUB_PATH"
      - run: typescript-language-server --version
      - run: bun test --timeout 60000 tests/lspEndpointsReal.test.ts tests/lspRealServer.test.ts
      - run: bun scripts/lsp-bench.ts

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-root-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run client:check
      - run: bun run client:test
      - run: bun run client:build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-web-${{ hashFiles('web/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
